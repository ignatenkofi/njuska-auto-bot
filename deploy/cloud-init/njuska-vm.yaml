#cloud-config
#
# cloud-init user-data для VM бота (issue #70).
#
# Заменяет ручные шаги 2-4 и 6 из deploy/DEPLOY.md: пакеты, пользователь,
# бинарь из релиза, systemd-юниты. После первой загрузки остаётся ровно один
# шаг — положить .env и запустить сервис.
#
# СЕКРЕТОВ ЗДЕСЬ НЕТ И БЫТЬ НЕ ДОЛЖНО. На Proxmox этот файл лежит снипетом в
# datastore и читается всеми, у кого есть доступ к хранилищу; токен Telegram и
# секрет CF-воркера доставляются отдельно, уже на живую VM (DEPLOY.md шаг 5).
#
# Юнит намеренно НЕ стартует на первой загрузке: без .env бот падает сразу,
# systemd уходит в рестарт-петлю с RestartSec=10, и журнал заполняется шумом
# ещё до того, как оператор успеет что-то положить. `enable` без `--now` даёт
# нужное: на будущих ребутах сервис поднимется сам, а первый старт — осознанный.

users:
  - name: njuska
    system: true
    shell: /usr/sbin/nologin
    homedir: /opt/njuska-auto-bot
    lock_passwd: true

# Зеркала по https. В VLAN 41 контракт RB5009 выпускает наружу только
# 443/53/123, а Debian cloud-образ по умолчанию ходит в deb.debian.org по
# HTTP/80 — package_update молча повис бы до таймаута. Полигонная роль base
# решает это тем же переключением; здесь оно нужно до первого apt.
apt:
  primary:
    - arches: [default]
      uri: https://deb.debian.org/debian
  security:
    - arches: [default]
      uri: https://security.debian.org/debian-security

package_update: true
packages:
  - curl
  - git
  - ca-certificates

write_files:
  - path: /etc/motd
    permissions: "0644"
    content: |

      NjuskaAutoBot — VM развёрнута cloud-init'ом, остался один шаг:

        1. Положить секреты:  sudo -u njuska vim /opt/njuska-auto-bot/.env
           (шаблон рядом: .env.example; обязательны CF_PROXY_URL,
            CF_PROXY_SECRET, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
            AUTHORIZED_USER_ID)
        2. Запустить:         sudo systemctl start njuska-auto-bot
        3. Проверить:         sudo journalctl -u njuska-auto-bot -f

      Обновление: sudo bash /opt/njuska-auto-bot/src/deploy/update.sh

runcmd:
  # Репо нужен на VM ради deploy/ (юниты, update.sh) — не ради сборки:
  # бинарь приезжает готовым из релиза, Rust на VM не ставится.
  - [ git, clone, --depth, "1", "https://github.com/ignatenkofi/njuska-auto-bot.git", /opt/njuska-auto-bot/src ]

  # Скачиваем, СВЕРЯЕМ и только потом chmod — одной командой. Непроверенный
  # файл не должен становиться исполняемым, и это не должно зависеть от того,
  # останавливает ли cloud-init скрипт runcmd после ошибки: он собирает пункты
  # в обычный шелл-скрипт без `set -e`, поэтому отдельный `chmod` следующим
  # пунктом отработал бы и после проваленной сверки. Цепочка `&&` убирает
  # вопрос целиком — не важно, как ведёт себя раннер.
  # Защищает от обрыва загрузки и от подмены байт на пути доставки; от
  # компрометации самого релиза — нет, сумма едет оттуда же
  # (devsecops-pipeline#18). Падение здесь оставляет VM без бота — это и есть
  # желаемый исход: лучше без бота, чем с неизвестным бинарём.
  - [ sh, -c, "cd /opt/njuska-auto-bot && curl -L --fail https://github.com/ignatenkofi/njuska-auto-bot/releases/latest/download/njuska_auto_bot -o njuska_auto_bot && curl -L --fail https://github.com/ignatenkofi/njuska-auto-bot/releases/latest/download/SHA256SUMS -o SHA256SUMS && sha256sum -c SHA256SUMS && rm -f SHA256SUMS && chmod 0755 njuska_auto_bot" ]

  # Preflight: бинарь вообще исполняется на этой машине (glibc, arch)?
  # --version не требует ни конфига, ни сети, ни базы. Падение здесь лучше
  # ловить сейчас, чем на первом старте сервиса.
  - [ sh, -c, "/opt/njuska-auto-bot/njuska_auto_bot --version" ]

  - [ sh, -c, "install -m 0600 -o njuska -g njuska /opt/njuska-auto-bot/src/.env.example /opt/njuska-auto-bot/.env.example" ]
  - [ sh, -c, "install -m 0644 /opt/njuska-auto-bot/src/deploy/njuska-auto-bot.service /etc/systemd/system/" ]
  - [ sh, -c, "install -m 0644 /opt/njuska-auto-bot/src/deploy/njuska-backup.service /etc/systemd/system/" ]
  - [ sh, -c, "install -m 0644 /opt/njuska-auto-bot/src/deploy/njuska-backup.timer /etc/systemd/system/" ]

  - [ chown, -R, "njuska:njuska", /opt/njuska-auto-bot ]
  - [ systemctl, daemon-reload ]
  # enable без --now: см. шапку.
  - [ systemctl, enable, njuska-auto-bot ]
  - [ systemctl, enable, --now, njuska-backup.timer ]
