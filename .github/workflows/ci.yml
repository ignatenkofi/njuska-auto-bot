# Runs on every push and pull request: fmt + clippy + tests + release build.
#
# Caching keeps the cycle under a minute after the first run.
# `curl` is preinstalled on `ubuntu-latest`, so the scraper's runtime
# dependency is satisfied for the test suite (which uses a saved HTML
# fixture and never makes a real HTTP request — see `tests/fixtures/`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run so new RustSec advisories against *unchanged* code still
  # surface — a repo that's quiet for a month shouldn't be silently
  # vulnerable (#28). Monday 06:20 UTC, after Dependabot's 06:00 sweep.
  schedule:
    - cron: "20 6 * * 1"
  # On-demand run: without it the audit job can only be exercised by waiting
  # for Monday or pushing a commit (#83).
  workflow_dispatch:

# Cancel in-flight runs when a new commit lands on the same branch — keeps
# the queue from filling up with stale jobs while you iterate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `dtolnay/rust-toolchain` is the de facto Rust toolchain action — small,
      # well-maintained, no Docker. Pinning to `stable` so the bot doesn't
      # accidentally rely on a nightly feature.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches: ~/.cargo/registry, ~/.cargo/git, ./target. Keyed on Cargo.lock
      # so dependency upgrades invalidate cleanly.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features --no-fail-fast

      # Release build last — slower, but proves the bot actually packages.
      # Artifact upload is intentionally absent: we don't ship binaries from
      # CI yet. Add `actions/upload-artifact` here when we want a downloadable
      # release.
      - name: cargo build --release
        run: cargo build --release

  # RustSec advisory scan (#28). Separate job so a vulnerable transitive dep
  # is a distinct red X from a compile/test failure. The action installs a
  # prebuilt cargo-audit — much faster than `cargo install cargo-audit`.
  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # the action files an issue for advisories on scheduled runs
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2026-0173: proc-macro-error2 is unmaintained. Pulled in
          # transitively via teloxide 0.17 -> aquamarine; nothing on our side
          # can swap it out. Re-check when bumping teloxide.
          ignore: RUSTSEC-2026-0173
