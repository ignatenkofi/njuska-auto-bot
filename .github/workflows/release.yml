# Builds a stripped Linux x86_64 binary, gates it on tests + a Debian 12
# smoke run, and publishes a GitHub Release.
#
# Trigger: **only** on push of a semver-shaped tag (`v0.1.0`, `v1.2.3-rc1`).
# Commits to main don't ship — they go through `ci.yml` (fmt/clippy/tests)
# but produce no artifact. To release, tag the commit you trust:
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# That gives a clean separation between "is `main` green?" (every commit)
# and "is this version production-ready?" (only when you decide).
#
# Pipeline shape (#27): build → smoke → publish as three jobs, so a binary
# that fails to *run* on the deployment OS never gets released, and the
# red X tells you which stage died.
#
# Why `ubuntu-22.04` for the build? Older glibc (2.35) than Debian 12
# (2.36), so the binary is portable across essentially all current
# production targets — which the smoke job then proves instead of assumes.

name: Release

on:
  push:
    tags: ["v*"]
  # Lets you re-trigger a release from the Actions UI if needed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Test & build ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          # When invoked via workflow_dispatch, check out the specified tag
          # rather than HEAD of the default branch.
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Belt and braces: main was green when tagged, but the tag may point
      # at an older commit, and a release built from failing tests is the
      # single worst artifact to ship (#27).
      - name: cargo test
        run: cargo test --all-features --no-fail-fast

      - name: Build release binary
        run: cargo build --release

      - name: Strip symbols
        run: strip target/release/njuska_auto_bot

      - name: Show binary info
        # Sanity in CI logs: SQLite is bundled (static), but teloxide's default
        # native-tls backend dynamically links the system libssl/libcrypto
        # (OpenSSL), present on the Debian 12 target — so `ldd` shows libc *and*
        # OpenSSL, not libc alone (see deploy/DEPLOY.md, #55).
        run: |
          ls -la target/release/njuska_auto_bot
          file target/release/njuska_auto_bot
          ldd target/release/njuska_auto_bot || true

      # Сумма считается здесь, рядом с рождением артефакта, а не в publish:
      # тогда её проверка в publish подтверждает, что между джобами артефакт
      # доехал целым. Посчитанная в момент публикации сумма была бы штампом,
      # который совпадает всегда и не проверяет ничего.
      - name: Checksum
        run: sha256sum njuska_auto_bot > SHA256SUMS

      - name: Upload binary for downstream jobs
        uses: actions/upload-artifact@v7
        with:
          name: njuska_auto_bot
          path: target/release/njuska_auto_bot
          if-no-files-found: error
          retention-days: 1

  # Runs the built binary inside a *pristine* Debian 12 container — the
  # actual deployment OS — to catch glibc/loader mismatches before they
  # become a broken release (#27). `--version` is the designed-for-this
  # cheap startup path: no .env, no network, no DB (see #1).
  smoke-debian12:
    name: Smoke test on Debian 12
    needs: build
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: njuska_auto_bot

      - name: Run --version on Debian 12
        run: |
          chmod +x ./njuska_auto_bot
          OUT="$(./njuska_auto_bot --version)"
          echo "binary says: $OUT"
          case "$OUT" in
            njuska_auto_bot\ *) echo "smoke test OK" ;;
            *) echo "unexpected --version output" >&2; exit 1 ;;
          esac

  publish:
    name: Publish ${{ inputs.tag || github.ref_name }}
    needs: [build, smoke-debian12]
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed for `gh release create`
    steps:
      # gh needs a repo checkout to infer the origin repo.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: njuska_auto_bot

      # Артефакт доехал тем же, каким собрался?
      - name: Verify checksum
        run: sha256sum -c SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # --generate-notes derives a changelog from commits since the
          # previous tag — saves us writing release notes by hand for the
          # common case.
          gh release create "$TAG" \
            njuska_auto_bot SHA256SUMS \
            --title "$TAG" \
            --generate-notes
