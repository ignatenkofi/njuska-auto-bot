# Builds a stripped Linux x86_64 binary and publishes a GitHub Release.
#
# Trigger: **only** on push of a semver-shaped tag (`v0.1.0`, `v1.2.3-rc1`).
# Commits to main don't ship — they go through `ci.yml` (fmt/clippy/tests)
# but produce no artifact. To release, tag the commit you trust:
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# That gives a clean separation between "is `main` green?" (every commit)
# and "is this version production-ready?" (only when you decide).
#
# Why `ubuntu-22.04`? See identical comment in original incarnation: older
# glibc (2.35) than Debian 12 (2.36), so the binary is portable across
# essentially all current production targets.

name: Release

on:
  push:
    tags: ["v*"]
  # Lets you re-trigger a release from the Actions UI if needed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.1.0)"
        required: true

jobs:
  release:
    name: Build & publish ${{ github.ref_name }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write # needed for `gh release create`
    steps:
      - uses: actions/checkout@v6
        with:
          # When invoked via workflow_dispatch, check out the specified tag
          # rather than HEAD of the default branch.
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Strip symbols
        run: strip target/release/njuska_auto_bot

      - name: Show binary info
        # Sanity in CI logs: dynamic deps should be tiny (just libc).
        run: |
          ls -la target/release/njuska_auto_bot
          file target/release/njuska_auto_bot
          ldd target/release/njuska_auto_bot || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # --generate-notes derives a changelog from commits since the
          # previous tag — saves us writing release notes by hand for the
          # common case.
          gh release create "$TAG" \
            target/release/njuska_auto_bot \
            --title "$TAG" \
            --generate-notes
